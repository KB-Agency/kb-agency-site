    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <text x="235.6" y="303.4" text-anchor="middle"
        font-family="'Unbounded', 'Arial Black', sans-serif" font-weight="700"
        font-size="208.6" letter-spacing="-4.7" fill="url(#gold)">KB</text>

