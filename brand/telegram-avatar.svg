  <rect width="512" height="512" fill="url(#bg)"/>

  <circle cx="379" cy="109" r="123" fill="url(#gold)" opacity="0.16" filter="url(#glow)"/>
  <circle cx="109" cy="427" r="104" fill="#6b5aa8" opacity="0.10" filter="url(#glow)"/>

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
